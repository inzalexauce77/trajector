name: Build Android APK
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: Generate Flutter Driver Project
      run: |
        if [ ! -d "flutter_driver_app" ]; then
          flutter create --org com.trajector --project-name trajector_driver flutter_driver_app
        fi
    - name: Configure App Manifest & Dependencies
      run: |
        cd flutter_driver_app

        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
        sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true

        flutter pub add geolocator http url_launcher

        mkdir -p lib/screens

        cat << 'MANIFEST' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
            <uses-permission android:name="android.permission.WAKE_LOCK" />
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

            <application
                android:label="Trajector Livreur"
                android:name="${applicationName}"
                android:icon="@mipmap/ic_launcher">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:launchMode="singleTop"
                    android:theme="@style/LaunchTheme"
                    android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                    android:hardwareAccelerated="true"
                    android:windowSoftInputMode="adjustResize">
                    <meta-data
                      android:name="io.flutter.embedding.android.NormalTheme"
                      android:resource="@style/NormalTheme" />
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN"/>
                        <category android:name="android.intent.category.LAUNCHER"/>
                    </intent-filter>
                </activity>
                <meta-data
                    android:name="flutterEmbedding"
                    android:value="2" />
            </application>
        </manifest>
        MANIFEST
    - name: Write Main & Screen UI
      run: |
        cd flutter_driver_app

        cat << 'MAINFILE' > lib/main.dart
        import 'package:flutter/material.dart';
        import 'screens/driver_home_screen.dart';

        void main() async {
          WidgetsFlutterBinding.ensureInitialized();
          runApp(const TrajectorDriverApp());
        }

        class TrajectorDriverApp extends StatelessWidget {
          const TrajectorDriverApp({super.key});

          @override
          Widget build(BuildContext context) {
            return MaterialApp(
              title: 'Trajector Livreur',
              debugShowCheckedModeBanner: false,
              theme: ThemeData(
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF059669),
                  primary: const Color(0xFF059669),
                ),
                useMaterial3: true,
              ),
              home: const DriverHomeScreen(),
            );
          }
        }
        MAINFILE

        cat << 'HOMEFILE' > lib/screens/driver_home_screen.dart
        import 'dart:async';
        import 'dart:convert';
        import 'package:flutter/material.dart';
        import 'package:geolocator/geolocator.dart';
        import 'package:http/http.dart' as http;
        import 'package:url_launcher/url_launcher.dart';

        class DriverHomeScreen extends StatefulWidget {
          const DriverHomeScreen({super.key});

          @override
          State<DriverHomeScreen> createState() => _DriverHomeScreenState();
        }

        class _DriverHomeScreenState extends State<DriverHomeScreen> {
          bool _isSubscribed = true;
          bool _isOnline = false;
          int _walletBalance = 4500;
          double _currentSpeed = 0.0;
          final String _driverId = "d_am_2456";
          final String _driverName = "Amadou Kouassi";
          final String _motoPlate = "2456 JJ 01";
          final String _trackingToken = "c_9f8a21b";
          
          StreamSubscription<Position>? _positionSubscription;

          @override
          void dispose() {
            _positionSubscription?.cancel();
            super.dispose();
          }

          Future<void> _toggleOnline(bool value) async {
            if (value) {
              if (!_isSubscribed) {
                _showPaymentModal();
                return;
              }
              LocationPermission permission = await Geolocator.checkPermission();
              if (permission == LocationPermission.denied) {
                permission = await Geolocator.requestPermission();
                if (permission == LocationPermission.denied) {
                  if (!mounted) return;
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(content: Text("Permission GPS requise pour diffuser votre position.")),
                  );
                  return;
                }
              }
              
              final locationSettings = AndroidSettings(
                accuracy: LocationAccuracy.high,
                distanceFilter: 3,
                forceLocationManager: true,
                intervalDuration: const Duration(seconds: 3),
                foregroundNotificationConfig: const ForegroundNotificationConfig(
                  notificationTitle: "Trajector GPS En Ligne",
                  notificationText: "Votre moto est visible en temps réel par les clients.",
                  enableWakeLock: true,
                ),
              );

              _positionSubscription = Geolocator.getPositionStream(locationSettings: locationSettings).listen((Position position) {
                if (!mounted) return;
                setState(() {
                  _currentSpeed = position.speed * 3.6;
                });
                _sendLocationTelemetry(position.latitude, position.longitude, _currentSpeed);
              });

              setState(() => _isOnline = true);
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(backgroundColor: Color(0xFF059669), content: Text("En ligne ! Émission GPS active (3s)")),
              );
            } else {
              await _positionSubscription?.cancel();
              _positionSubscription = null;
              setState(() {
                _isOnline = false;
                _currentSpeed = 0.0;
              });
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text("Émission GPS coupée.")),
              );
            }
          }

          Future<void> _sendLocationTelemetry(double lat, double lng, double speed) async {
            try {
              final url = Uri.parse("https://www.trajector.online/api/telemetry/ping");
              await http.post(
                url,
                headers: {"Content-Type": "application/json"},
                body: jsonEncode({
                  "driver_id": _driverId,
                  "tracking_token": _trackingToken,
                  "lat": lat,
                  "lng": lng,
                  "speed": speed,
                  "battery": 85,
                  "timestamp": DateTime.now().toIso8601String(),
                }),
              ).timeout(const Duration(seconds: 2));
            } catch (_) {}
          }

          void _showPaymentModal() {
            showModalBottomSheet(
              context: context,
              shape: const RoundedRectangleBorder(
                borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
              ),
              builder: (ctx) => Padding(
                padding: const EdgeInsets.all(24.0),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Container(width: 40, height: 4, decoration: BoxDecoration(color: Colors.grey.shade300, borderRadius: BorderRadius.circular(2))),
                    const SizedBox(height: 16),
                    const Text("Pass Journalier Moto", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 6),
                    const Text("500 FCFA / jour", style: TextStyle(fontSize: 26, fontWeight: FontWeight.w900, color: Color(0xFF059669))),
                    const Text("Accès illimité à la marketplace & diffusion GPS 24h", style: TextStyle(fontSize: 12, color: Colors.grey)),
                    const SizedBox(height: 20),
                    ListTile(
                      tileColor: Colors.blue.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      leading: const Text("🌊", style: TextStyle(fontSize: 24)),
                      title: const Text("Payer avec Wave", style: TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text("Validation instantanée"),
                      onTap: () {
                        Navigator.pop(ctx);
                        _activatePass("Wave");
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      tileColor: Colors.orange.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      leading: const Text("🟠", style: TextStyle(fontSize: 24)),
                      title: const Text("Orange Money / MTN MoMo", style: TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text("Paiement via CinetPay"),
                      onTap: () {
                        Navigator.pop(ctx);
                        _activatePass("Mobile Money");
                      },
                    ),
                    const SizedBox(height: 10),
                    ListTile(
                      tileColor: Colors.emerald.shade50,
                      shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                      leading: const Text("👛", style: TextStyle(fontSize: 24)),
                      title: Text("Déduire du solde ($_walletBalance F)", style: const TextStyle(fontWeight: FontWeight.bold)),
                      subtitle: const Text("Paiement direct sans frais"),
                      onTap: () {
                        Navigator.pop(ctx);
                        if (_walletBalance >= 500) {
                          setState(() => _walletBalance -= 500);
                          _activatePass("Portefeuille");
                        }
                      },
                    ),
                  ],
                ),
              ),
            );
          }

          void _activatePass(String method) {
            setState(() => _isSubscribed = true);
            ScaffoldMessenger.of(context).showSnackBar(
              SnackBar(
                backgroundColor: const Color(0xFF059669),
                content: Text("Pass 500 F activé avec succès via $method !"),
              ),
            );
          }

          Future<void> _shareOnWhatsApp() async {
            final link = "https://www.trajector.online/suivi/$_trackingToken";
            final message = "Bonjour ! Suivez ma moto en direct jusqu'à votre livraison ici : $link";
            final uri = Uri.parse("https://wa.me/?text=${Uri.encodeComponent(message)}");
            if (await canLaunchUrl(uri)) {
              await launchUrl(uri, mode: LaunchMode.externalApplication);
            }
          }

          @override
          Widget build(BuildContext context) {
            return Scaffold(
              backgroundColor: const Color(0xFFF8FAFC),
              appBar: AppBar(
                elevation: 0,
                backgroundColor: const Color(0xFF0F172A),
                title: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(6),
                      decoration: BoxDecoration(color: const Color(0xFF059669), borderRadius: BorderRadius.circular(8)),
                      child: const Text("🛵", style: TextStyle(fontSize: 16)),
                    ),
                    const SizedBox(width: 10),
                    const Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text("Trajector Livreur", style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
                        Text("Cockpit Abidjan", style: TextStyle(fontSize: 11, color: Color(0xFF94A3B8))),
                      ],
                    ),
                  ],
                ),
                actions: [
                  Padding(
                    padding: const EdgeInsets.only(right: 16),
                    child: Center(
                      child: Text(
                        "$_walletBalance F",
                        style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.white, fontSize: 15),
                      ),
                    ),
                  )
                ],
              ),
              body: ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(16),
                      boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.04), blurRadius: 10)],
                    ),
                    child: Row(
                      children: [
                        CircleAvatar(
                          radius: 26,
                          backgroundColor: Colors.grey.shade100,
                          child: const Text("👨🏾‍💼", style: TextStyle(fontSize: 26)),
                        ),
                        const SizedBox(width: 14),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(_driverName, style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                              Text("Moto: $_motoPlate • Haojue 110", style: TextStyle(fontSize: 12, color: Colors.grey.shade600)),
                              const SizedBox(height: 4),
                              Container(
                                padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                decoration: BoxDecoration(color: Colors.emerald.shade50, borderRadius: BorderRadius.circular(6)),
                                child: const Text("Livreur Agréé", style: TextStyle(fontSize: 11, color: Color(0xFF059669), fontWeight: FontWeight.bold)),
                              ),
                            ],
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: _isSubscribed ? const Color(0xFFECFDF5) : const Color(0xFFFEF2F2),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: _isSubscribed ? const Color(0xFFA7F3D0) : const Color(0xFFFECACA)),
                    ),
                    child: Column(
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Row(
                              children: [
                                Text(_isSubscribed ? "⚡" : "⚠️", style: const TextStyle(fontSize: 20)),
                                const SizedBox(width: 8),
                                Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text("Pass Journalier (500 FCFA)", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                                    Text(
                                      _isSubscribed ? "Valide jusqu'à 23h59" : "Pass expiré - Renouvellement requis",
                                      style: TextStyle(fontSize: 11, color: Colors.grey.shade600),
                                    ),
                                  ],
                                ),
                              ],
                            ),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                              decoration: BoxDecoration(
                                color: _isSubscribed ? const Color(0xFF059669) : Colors.red,
                                borderRadius: BorderRadius.circular(20),
                              ),
                              child: Text(
                                _isSubscribed ? "ACTIF" : "EXPIRÉ",
                                style: const TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.bold),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton.icon(
                            onPressed: _showPaymentModal,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF0F172A),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                            ),
                            icon: const Text("💳"),
                            label: Text(_isSubscribed ? "Recharger / Prolonger (500 F)" : "Payer le Pass (500 F)"),
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: const Color(0xFF0F172A),
                      borderRadius: BorderRadius.circular(16),
                    ),
                    child: Column(
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Row(
                              children: [
                                Container(
                                  width: 10,
                                  height: 10,
                                  decoration: BoxDecoration(
                                    shape: BoxShape.circle,
                                    color: _isOnline ? const Color(0xFF10B981) : Colors.grey,
                                  ),
                                ),
                                const SizedBox(width: 10),
                                const Text("Émission GPS Direct", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold)),
                              ],
                            ),
                            Switch(
                              value: _isOnline,
                              activeColor: const Color(0xFF10B981),
                              onChanged: _toggleOnline,
                            ),
                          ],
                        ),
                        const Divider(color: Color(0xFF334155), height: 20),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceAround,
                          children: [
                            Column(
                              children: [
                                const Text("Vitesse", style: TextStyle(color: Color(0xFF94A3B8), fontSize: 11)),
                                Text("${_currentSpeed.toStringAsFixed(0)} km/h", style: const TextStyle(color: Color(0xFF10B981), fontWeight: FontWeight.bold, fontSize: 16)),
                              ],
                            ),
                            Column(
                              children: [
                                const Text("Batterie", style: TextStyle(color: Color(0xFF94A3B8), fontSize: 11)),
                                const Text("85%", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                              ],
                            ),
                            Column(
                              children: [
                                const Text("Fréquence", style: TextStyle(color: Color(0xFF94A3B8), fontSize: 11)),
                                const Text("3 sec", style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 16)),
                              ],
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(16),
                      boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.04), blurRadius: 10)],
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Text("Partager ma position avec le client", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 13)),
                        const SizedBox(height: 6),
                        Container(
                          padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                          decoration: BoxDecoration(color: Colors.grey.shade100, borderRadius: BorderRadius.circular(8)),
                          child: Row(
                            children: [
                              Expanded(
                                child: Text(
                                  "https://www.trajector.online/suivi/$_trackingToken",
                                  style: TextStyle(fontFamily: "monospace", fontSize: 12, color: Colors.grey.shade700),
                                ),
                              ),
                            ],
                          ),
                        ),
                        const SizedBox(height: 10),
                        SizedBox(
                          width: double.infinity,
                          child: ElevatedButton.icon(
                            onPressed: _shareOnWhatsApp,
                            style: ElevatedButton.styleFrom(
                              backgroundColor: const Color(0xFF25D366),
                              foregroundColor: Colors.white,
                              shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(10)),
                            ),
                            icon: const Text("💬"),
                            label: const Text("Envoyer le lien via WhatsApp"),
                          ),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Container(
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: Colors.white,
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: Colors.amber.shade200),
                      boxShadow: [BoxShadow(color: Colors.black.withOpacity(0.04), blurRadius: 10)],
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            const Text("Course en cours #CMD-8421", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14)),
                            Container(
                              padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                              decoration: BoxDecoration(color: Colors.amber.shade50, borderRadius: BorderRadius.circular(6)),
                              child: const Text("1 500 FCFA", style: TextStyle(fontWeight: FontWeight.bold, color: Colors.amber, fontSize: 12)),
                            ),
                          ],
                        ),
                        const SizedBox(height: 10),
                        const Text("📍 Ramassage: Boutique Marie, Yopougon", style: TextStyle(fontSize: 12)),
                        const SizedBox(height: 4),
                        const Text("🎯 Livraison: Cocody Angré 8e Tranche", style: TextStyle(fontSize: 12)),
                        const SizedBox(height: 4),
                        const Text("💵 À encaisser (COD): 25 000 FCFA", style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 12),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton(
                            onPressed: () {
                              ScaffoldMessenger.of(context).showSnackBar(
                                const SnackBar(content: Text("Course #CMD-8421 validée avec succès !")),
                              );
                            },
                            child: const Text("✓ Clôturer la livraison"),
                          ),
                        ),
                      ],
                    ),
                  ),
                ],
              ),
            );
          }
        }
        HOMEFILE
    - name: Install dependencies
      run: |
        cd flutter_driver_app
        flutter pub get
    - name: Build Android Release APK
      run: |
        cd flutter_driver_app
        flutter build apk --release
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trajector-driver-apk
        path: flutter_driver_app/build/app/outputs/flutter-apk/app-release.apk
