name: Build Android APK

on:
  workflow_dispatch: # Permet de lancer la compilation en 1 clic

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: |
          cd flutter_driver_app
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_driver_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trajector-driver-app
          path: flutter_driver_app/build/app/outputs/flutter-apk/app-release.apk
